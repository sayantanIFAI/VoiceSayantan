; Lab dialplan for the free SIP-trunk simulation.
; 2001 = patient (Linphone), 1001 = agent (MicroSIP), 7000 = fake hospital
; number. GROUP_COUNT() below is a teaching-only capacity counter, NOT
; race-safe -- see the project doc's section 6 warning. Do not treat it as
; evidence of a real admission-control cap.

[lab-internal]

exten => 1001,1,NoOp(Call human agent)
 same => n,Dial(PJSIP/1001,20)
 same => n,Hangup()

exten => 2001,1,NoOp(Call test caller)
 same => n,Dial(PJSIP/2001,20)
 same => n,Hangup()

exten => 7000,1,NoOp(Fake hospital call)
 same => n,Answer()
 same => n,GotoIf($[${GROUP_COUNT(ai@lab-ai)} >= 2]?overflow)
 same => n,Set(GROUP(lab-ai)=ai)
 same => n,NoOp(AI_ACTIVE=${GROUP_COUNT(ai@lab-ai)})
 same => n,Dial(WebSocket/voicebot/c(slin16))
 same => n,Hangup()
 same => n(overflow),NoOp(OVERFLOW_TO_HUMAN)
 same => n,Goto(lab-humans,s,1)

exten => 0,1,NoOp(Transfer to human)
 same => n,Set(GROUP(lab-ai)=)
 same => n,Goto(lab-humans,s,1)

[lab-humans]

exten => s,1,NoOp(Entering reception queue)
 same => n,Queue(reception,t,,,20)
 same => n,NoOp(QUEUESTATUS=${QUEUESTATUS})
 same => n,Playback(beep)
 same => n,Hangup()
