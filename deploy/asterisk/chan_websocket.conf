; Configuration for chan_websocket.
;
; MUST be json: agent/asterisk_media.py's parse_event() only understands chan_websocket's JSON
; control-message format. Asterisk's own packaged sample ships with this commented out, which
; defaults to the legacy "plain-text" format -- in that mode Asterisk still sends a MEDIA_START
; equivalent, but the Python side can't parse it, silently discards it, waits out its own 10s
; timeout (agent/asterisk_bridge.py START_TIMEOUT_S) and hangs up with no reply. Confirmed live:
; without this file (or with it left at the commented-out default), every call into the AI bridge
; logged "Asterisk stream refused: no MEDIA_START event from Asterisk in time" and the caller heard
; nothing, despite the WebSocket connection itself succeeding.
[global]
control_message_format = json
