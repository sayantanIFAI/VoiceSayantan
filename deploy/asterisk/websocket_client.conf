[voicebot]
type = websocket_client
connection_type = per_call_config
; Pod id changes on every RunPod migration/recreate (prior ones: yg05z7tei6zrh8, q7pnhclzr71hhh --
; do not assume either is current). Re-check against the RunPod console if this has been a while.
uri = wss://daxinx14opukjb-8888.proxy.runpod.net/asterisk-media/
protocols = media
username = asterisk
password = 5e213a218be9e77df7b38661
connection_timeout = 3000
reconnect_interval = 1000
reconnect_attempts = 2
tls_enabled = yes
ca_list_file = /etc/ssl/certs/ca-certificates.crt
; verify_server_hostname disabled ONLY: Asterisk's tcptls.c compares the cert
; CN against the peer's resolved IP rather than the SNI hostname when the
; remote is a Cloudflare-fronted multi-IP edge (confirmed via direct log
; inspection: "Certificate common name from peer '104.18.7.228:443' did not
; match (yg05z7tei6zrh8-8888.proxy.runpod.net)" -- curl against the same host
; succeeds fine, so this is Asterisk-side, not a real cert problem).
; verify_server_cert (chain/CA validation) stays at its secure default (yes).
verify_server_hostname = no
