; AMI, bound to loopback only -- used solely by deploy/asterisk/ami_dtmf_transfer.py on this same
; VM to issue a Redirect when the caller presses 0 mid-AI-call (see that script's docstring for
; why this needs AMI at all). Never bind this to 0.0.0.0 -- see the security note Asterisk ships
; at the top of its own manager.conf sample.
[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1

[dtmf-bridge]
secret = 9d25a88151db63a019927337fa5897d6
; "dialplan" is its own AMI read class, separate from "call" -- without it Newexten events (which is
; how ami_dtmf_transfer.py learns a channel is inside extension 7000's AI leg) never arrive, and the
; script silently never redirects anything on keypad 0. Confirmed live: missing this class is exactly
; why a mid-call "0" did nothing even though the script was running and logged in.
read = call,dtmf,dialplan
write = call
