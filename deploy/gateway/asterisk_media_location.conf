# Asterisk chan_websocket media route for the pod's nginx gateway (agent/asterisk_bridge.py).
#
# Unlike Twilio (deploy/gateway/twilio_location.conf), Asterisk's res_websocket_client CAN send HTTP
# Basic Auth credentials (username/password fields in websocket_client.conf) -- so this path keeps
# auth_basic ON, with its OWN htpasswd file, separate from the browser-demo login. Create it once:
#     htpasswd -bc /workspace/gateway/htpasswd_asterisk asterisk '<a generated password, not committed>'
# and put the matching username/password in the Asterisk VM's/VPS's websocket_client.conf connection.
#
# Install: paste this block inside the existing `server { listen 8888; ... }` of
# /workspace/gateway/nginx.conf, then `bash /workspace/gateway/gateway.sh pcm` (reloads nginx).
# Requires the same `map $http_upgrade $connection_upgrade { default upgrade; '' close; }` at http{}
# level that twilio_location.conf's install note mentions -- already present if that one is installed.
#
# NOT YET INSTALLED. Drafted alongside agent/asterisk_bridge.py while the Asterisk host (VM/VPS) was
# still being set up -- nothing to connect to yet, so this has not been pasted into the live
# nginx.conf or reloaded. Do that only once the Asterisk side is reachable and ready to test.

location /asterisk-media/ {
    auth_basic "Asterisk media bridge";
    auth_basic_user_file /workspace/gateway/htpasswd_asterisk;
    rewrite ^/asterisk-media/(.*)$ /asterisk/media break;
    proxy_pass http://voice_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
